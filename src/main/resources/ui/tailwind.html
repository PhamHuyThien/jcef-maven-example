<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body class="mt-3">
<div class="drawer lg:drawer-open">
    <input id="my-drawer-4" type="checkbox" class="drawer-toggle"/>
    <div class="drawer-content">
        <!-- Navbar -->
        <nav class="navbar w-full bg-base-300">
            <label for="my-drawer-4" aria-label="open sidebar" class="btn btn-square btn-ghost">
                <!-- Sidebar toggle icon -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round"
                     stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor"
                     class="my-1.5 inline-block size-4">
                    <path d="M4 4m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z"></path>
                    <path d="M9 4v16"></path>
                    <path d="M14 10l2 2l-2 2"></path>
                </svg>
            </label>
            <div class="px-4">Navbar Title</div>
        </nav>
        <!-- Page content here -->
        <div class="p-4">
            <p>Page Content</p>
            <input type="text" class="input" placeholder="Which browser do you use" list="browsers" />
            <datalist id="browsers">
                <option value="Chrome"></option>
                <option value="Firefox"></option>
                <option value="Safari"></option>
                <option value="Opera"></option>
                <option value="Edge"></option>
            </datalist>
            <input type="date" class="input" />
            <input type="time" class="input" />
            <input type="checkbox" checked="checked" class="toggle" />
        </div>
    </div>

    <div class="drawer-side is-drawer-close:overflow-visible">
        <label for="my-drawer-4" aria-label="close sidebar" class="drawer-overlay"></label>
        <div class="flex min-h-full flex-col items-start bg-base-200 is-drawer-close:w-14 is-drawer-open:w-64">
            <!-- Sidebar content here -->
            <ul class="menu w-full grow">
                <!-- List item -->
                <li>
                    <button class="is-drawer-close:tooltip is-drawer-close:tooltip-right" data-tip="Homepage"
                            onclick="console.log('Home')">
                        <!-- Home icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round"
                             stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor"
                             class="my-1.5 inline-block size-4">
                            <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path>
                            <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        </svg>
                        <span class="is-drawer-close:hidden">Homepage</span>
                    </button>
                </li>

                <!-- List item -->
                <li>
                    <button class="is-drawer-close:tooltip is-drawer-close:tooltip-right" data-tip="Settings">
                        <!-- Settings icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round"
                             stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor"
                             class="my-1.5 inline-block size-4">
                            <path d="M20 7h-9"></path>
                            <path d="M14 17H5"></path>
                            <circle cx="17" cy="17" r="3"></circle>
                            <circle cx="7" cy="7" r="3"></circle>
                        </svg>
                        <span class="is-drawer-close:hidden">Settings</span>
                    </button>
                </li>
            </ul>
        </div>
    </div>
</div>
<footer class="footer sm:footer-horizontal bg-base-200 text-base-content p-10">
    <nav>
        <h6 class="footer-title">Services</h6>
        <a class="link link-hover">Branding</a>
        <a class="link link-hover">Design</a>
        <a class="link link-hover">Marketing</a>
        <a class="link link-hover">Advertisement</a>
    </nav>
    <nav>
        <h6 class="footer-title">Company</h6>
        <a class="link link-hover">About us</a>
        <a class="link link-hover">Contact</a>
        <a class="link link-hover">Jobs</a>
        <a class="link link-hover">Press kit</a>
    </nav>
    <nav>
        <h6 class="footer-title">Legal</h6>
        <a class="link link-hover">Terms of use</a>
        <a class="link link-hover">Privacy policy</a>
        <a class="link link-hover" >Cookie policy</a>
    </nav>
    <form onsubmit="return false;">
        <h6 class="footer-title">Newsletter</h6>
        <fieldset class="w-80">
            <label>Enter your email address</label>
            <div class="join">
                <input
                        id="email-subscribe"
                        type="text"
                        placeholder="username@site.com"
                        class="input input-bordered join-item"/>
                <button class="btn btn-primary join-item" onclick="subscribe()"
                        >Subscribe
                </button>
            </div>
        </fieldset>
    </form>
</footer>
<script>
    function subscribe() {
        let email = document.getElementById('email-subscribe').value;
        window.cefQuery({
            request: JSON.stringify(['subscribe', {email}]),
            onSuccess: function (response) {
                alert(response);
            },
            onFailure: function (code, msg) {
                alert(code + " - " + msg);
            }
        })
    }
</script>
</body>
</html>
